version: "3.8"

services:
  # --- Frontend ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - memoragraph

  # --- Backend ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://memoragraph:memoragraph@postgres:5432/memoragraph
      - NEO4J_URI=bolt://neo4j:7687
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - postgres
      - neo4j
      - qdrant
    volumes:
      - ./data:/app/data
    networks:
      - memoragraph

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: memoragraph
      POSTGRES_PASSWORD: memoragraph
      POSTGRES_DB: memoragraph
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - memoragraph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoragraph"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Neo4j ---
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/memoragraph
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - memoragraph
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Qdrant ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - memoragraph
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Ollama ---
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - memoragraph
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  ollama_data:

networks:
  memoragraph:
    driver: bridge
